# Quality gate. Before this existed the only check anywhere was `npm run build` inside the
# auto-merge workflow, so the unit tests and eslint never ran in CI at all.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: this workflow must never be able to write to the repo, and it runs on
# pull_request, which includes forks.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, typecheck and test need Node 22: several suites use node:test module mocking
  # (`mock.module`, behind --experimental-test-module-mocks), which does not exist before
  # Node 22.3. On Node 20 those files throw at import time, so their tests never register
  # and the run reports fewer tests plus 4 failures.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` also fails when package-lock.json drifts from package.json, which is
      # exactly what broke the Cloud Build image. Catch it here instead of at deploy.
      # --ignore-scripts: this runs on fork PRs, so never execute their lifecycle scripts.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Lint
        run: npx eslint src

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

  # The build runs on the version production actually ships: Dockerfile is node:20-alpine.
  # Keeping this separate means a Node 20 build regression is still caught, even though the
  # test tooling needs a newer runtime.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
