name: Cron Auto-merge PRs

on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes
  workflow_dispatch:

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-merge PRs
        run: |
          echo "Fetching open mergeable PRs with passing status checks..."

          # List open PRs and filter using jq
          # Criteria:
          # 1. Mergeable state is MERGEABLE
          # 2. Status checks are SUCCESS

          # Select PRs based on security-hardened criteria (Exact author match)
          # We include PRs from trusted authors even if not yet approved, as we will approve them in the loop.
          gh pr list --json number,mergeable,statusCheckRollup,author -q '.[] | select(.mergeable == "MERGEABLE" and .statusCheckRollup.state == "SUCCESS" and (.author.login == "asangzz" or .author.login == "jules-google[bot]" or .author.login == "jules[bot]")) | .number' > pr_numbers.txt

          if [ ! -s pr_numbers.txt ]; then
            echo "No PRs found from trusted authors that are ready for automatic merging."
            exit 0
          fi

          while read pr; do
            echo "Processing PR #$pr..."
            # Automatically approve the PR if it's from a trusted author and not already approved
            gh pr review $pr --approve || echo "PR #$pr already reviewed or could not be approved"
            gh pr merge $pr --squash --admin || gh pr merge $pr --squash || echo "Failed to merge PR #$pr"
          done < pr_numbers.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
