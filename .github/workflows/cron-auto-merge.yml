name: Cron Auto-merge PRs

on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes
  workflow_dispatch:

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-merge PRs
        run: |
          echo "Fetching open mergeable PRs with passing status checks..."

          # List open PRs and filter using jq
          # Criteria:
          # 1. Mergeable state is MERGEABLE
          # 2. Status checks are SUCCESS
          # 3. PR is APPROVED (Safety first)

          # Select PRs based on security-hardened criteria (Exact author match)
          # Increased limit to 50 PRs to be more robust for busy periods
          gh pr list --limit 50 --json number,mergeable,statusCheckRollup,reviewDecision,author -q '.[] | select(.mergeable == "MERGEABLE" and .statusCheckRollup.state == "SUCCESS" and .reviewDecision == "APPROVED" and (.author.login == "asangzz" or .author.login == "jules-google[bot]" or .author.login == "jules[bot]")) | .number' > pr_numbers.txt

          if [ ! -s pr_numbers.txt ]; then
            echo "No approved PRs found that are ready for automatic merging."
            exit 0
          fi

          echo "Found $(wc -l < pr_numbers.txt) PRs ready for merging."

          while read pr; do
            echo "Processing PR #$pr..."
            # Using squash merge for a clean history
            if gh pr merge $pr --squash --admin; then
              echo "✅ Successfully merged PR #$pr via admin override"
            elif gh pr merge $pr --squash; then
              echo "✅ Successfully merged PR #$pr"
            else
              echo "❌ Failed to merge PR #$pr"
            fi
          done < pr_numbers.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
