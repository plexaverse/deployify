name: Cron Auto-merge PRs

on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes
  workflow_dispatch:

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-approve and Merge PRs
        run: |
          echo "Processing open PRs for auto-approval and merging..."

          # 1. Auto-approve PRs from trusted authors if they have SUCCESS status checks
          # Trusted authors: jules-google[bot], jules[bot], asangzz
          gh pr list --json number,author,statusCheckRollup,reviewDecision -q '.[] | select((.author.login == "jules-google[bot]" or .author.login == "jules[bot]" or .author.login == "asangzz") and .statusCheckRollup.state == "SUCCESS" and .reviewDecision != "APPROVED") | .number' > to_approve.txt

          if [ -s to_approve.txt ]; then
            while read pr; do
              echo "Auto-approving PR #$pr from trusted author..."
              gh pr review $pr --approve || echo "Failed to approve PR #$pr"
            done < to_approve.txt
          else
            echo "No PRs requiring auto-approval found."
          fi

          # 2. Fetch open mergeable PRs with passing status checks AND approval
          gh pr list --json number,mergeable,statusCheckRollup,reviewDecision \
            -q '.[] | select(.mergeable == "MERGEABLE" and .statusCheckRollup.state == "SUCCESS" and .reviewDecision == "APPROVED") | .number' > pr_numbers.txt

          if [ ! -s pr_numbers.txt ]; then
            echo "No approved PRs found that are ready for automatic merging."
            exit 0
          fi

          while read pr; do
            echo "Merging PR #$pr..."
            gh pr merge $pr --squash --admin || gh pr merge $pr --squash || echo "Failed to merge PR #$pr"
          done < pr_numbers.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
