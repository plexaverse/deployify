name: Cron Auto-merge PRs

on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes
  workflow_dispatch:

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-merge PRs
        run: |
          echo "Fetching open mergeable PRs with passing status checks..."

          # List open PRs and filter using jq
          # Criteria:
          # 1. Mergeable state is MERGEABLE
          # 2. Status checks are SUCCESS
          # 3. PR is APPROVED (Safety first)

          # List open PRs and filter using jq
          # Criteria for auto-approval: PR from trusted accounts (jules-google[bot], jules[bot], asangzz)
          # Criteria for merging:
          # 1. Mergeable state is MERGEABLE
          # 2. Status checks are SUCCESS
          # 3. PR is APPROVED

          echo "Checking for PRs from trusted accounts to auto-approve..."
          gh pr list --json number,author,reviewDecision -q '.[] | select(.reviewDecision != "APPROVED" and (.author.login == "jules-google[bot]" or .author.login == "jules[bot]" or .author.login == "asangzz")) | .number' > to_approve.txt

          while read pr; do
            echo "Auto-approving PR #$pr from trusted account..."
            gh pr review --approve $pr || echo "Failed to approve PR #$pr"
          done < to_approve.txt

          echo "Fetching open mergeable PRs with passing status checks..."
          gh pr list --json number,mergeable,statusCheckRollup,reviewDecision -q '.[] | select(.mergeable == "MERGEABLE" and .statusCheckRollup.state == "SUCCESS" and .reviewDecision == "APPROVED") | .number' > pr_numbers.txt

          if [ ! -s pr_numbers.txt ]; then
            echo "No approved PRs found that are ready for automatic merging."
            exit 0
          fi

          while read pr; do
            echo "Processing PR #$pr..."
            gh pr merge $pr --squash --admin || gh pr merge $pr --squash || echo "Failed to merge PR #$pr"
          done < pr_numbers.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
