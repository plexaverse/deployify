name: Deployify Auto-merge PRs

on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes
  workflow_dispatch:

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-merge Ready PRs
        run: |
          echo "Scanning for PRs that are approved, passing checks, and mergeable..."

          # Criteria for automated merging:
          # 1. PR state must be OPEN (gh pr list handles this by default)
          # 2. Mergeable state must be 'MERGEABLE' (no conflicts)
          # 3. All status checks must have a rollup state of 'SUCCESS'
          # 4. The review decision must be 'APPROVED'

          PR_LIST=$(gh pr list --json number,mergeable,statusCheckRollup,reviewDecision -q '.[] | select(.mergeable == "MERGEABLE" and .statusCheckRollup.state == "SUCCESS" and .reviewDecision == "APPROVED") | .number')

          if [ -z "$PR_LIST" ]; then
            echo "No PRs currently meet all auto-merge criteria."
            exit 0
          fi

          for pr in $PR_LIST; do
            echo "Processing PR #$pr..."
            # Attempt to merge using squash strategy
            # Use --admin to bypass branch protection if possible, fallback to standard merge
            gh pr merge $pr --squash --admin || gh pr merge $pr --squash || echo "Error: Could not merge PR #$pr"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
